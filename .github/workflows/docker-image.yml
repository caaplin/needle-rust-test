name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push the notebook sandbox image
      run: |
        cd ubuntu-notebook-server
        docker build . --file Dockerfile --tag ${{ secrets.DOCKERHUB_USERNAME }}/ubuntu-notebook:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/ubuntu-notebook:latest

    - name: Build and push the notebook server image
      run: |
        cd ubuntu-notebook-server
        docker build . --file Dockerfile.server --tag ${{ secrets.DOCKERHUB_USERNAME }}/ubuntu-notebook-server:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/ubuntu-notebook-server:latest
